name: vault_ai
description: VaultAI - AI-powered document wallet for secure document management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Supabase
  supabase_flutter: ^2.5.3

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.1.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  local_auth: ^2.3.0

  # Storage & Files
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  open_filex: ^4.3.4

  # PDF & Document
  syncfusion_flutter_pdf: ^26.1.41
  pdfx: ^2.6.0
  printing: ^5.13.1

  # Camera & Scanner
  camera: ^0.11.0+2
  image: ^4.2.0
  image_cropper: ^7.1.0
  edge_detection: ^1.0.9

  # Encryption & Security
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # HTTP & API
  dio: ^5.4.3+1
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Local Database & Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  badges: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.11
  glass_kit: ^4.0.0

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.7.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  awesome_notifications: ^0.9.3+1

  # Biometrics
  pin_code_fields: ^8.0.1

  # Permissions
  permission_handler: ^11.3.1

  # Device Info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Fonts
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3

  # Utilities
  uuid: ^4.4.0
  logger: ^2.3.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  flutter_dotenv: ^5.1.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  dartz: ^0.10.1
  equatable: ^2.0.5
  collection: ^1.18.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
